<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3b3f4c"/><stop offset="1" stop-color="#16171c"/></linearGradient>
    <linearGradient id="dial" gradientUnits="userSpaceOnUse" x1="0" y1="28" x2="0" y2="98"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#c3c8d2"/></linearGradient>
    <linearGradient id="hot" gradientUnits="userSpaceOnUse" x1="0" y1="48" x2="0" y2="94"><stop offset="0" stop-color="#ffb23e"/><stop offset="1" stop-color="#ff4f3a"/></linearGradient>
    <linearGradient id="air" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4fe3ff"/><stop offset="1" stop-color="#3b82f6"/></linearGradient>
    <g id="gauge" fill="none" stroke-width="10" stroke-linecap="round">
      <path id="scale" d="M40.7 91.3A33 33 0 0 1 85.2 42.7"/>
      <path id="zone" d="M92.6 51.5A33 33 0 0 1 87.3 91.3"/>
    </g>
    <path id="needle" d="M88.6 50.8L66.9 72.1 61.1 63.9z"/>
  </defs>
  <rect x="8" y="8" width="112" height="112" rx="28" fill="url(#bg)"/>
  <rect x="9" y="9" width="110" height="110" rx="27" fill="none" stroke="#fff" stroke-opacity=".1" stroke-width="2"/>
  <!-- load -->
  <path d="M18.6 76.2A47 47 0 0 1 37 25.5" fill="none" stroke="url(#air)" stroke-width="5" stroke-linecap="round"/>
  <path d="M109.4 51.8A47 47 0 0 1 91 102.5" fill="none" stroke="url(#air)" stroke-width="5" stroke-linecap="round"/>
  <!-- gauge: the scale, and its hot end -->
  <use href="#gauge" stroke="#000" opacity=".35" transform="translate(0 3)"/>
  <use href="#scale" fill="none" stroke="url(#dial)" stroke-width="10" stroke-linecap="round"/>
  <use href="#zone" fill="none" stroke="url(#hot)" stroke-width="10" stroke-linecap="round"/>
  <!-- needle and hub -->
  <use href="#needle" fill="#000" opacity=".35" transform="translate(0 3)"/>
  <use href="#needle" fill="url(#dial)" stroke="url(#dial)" stroke-width="3" stroke-linejoin="round"/>
  <circle cx="64" cy="68" r="11" fill="#101116"/>
  <circle cx="64" cy="68" r="5.5" fill="none" stroke="url(#air)" stroke-width="3.5"/>
</svg>
